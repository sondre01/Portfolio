<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home - Portfolio</title>

  <!-- Global + Page CSS -->
  <link rel="stylesheet" href="../assets/css/index.css" />
  <link rel="stylesheet" href="../assets/css/main.css" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            'fade-up': 'fadeUp 0.9s ease-out forwards',
            'caret': 'caretBlink 0.9s steps(1) infinite',
          },
          keyframes: {
            fadeUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            caretBlink: {
              '0%, 49%': { opacity: '1' },
              '50%, 100%': { opacity: '0' },
            }
          }
        }
      }
    }
  </script>
</head>

<body style="visibility:hidden;">
  <div id="header-footer"></div>

  <main id="homeContent" class="js-fade-in">
    <section class="hero">
      <div class="main-content-wrapper">
        <div class="hero-content-wrapper">

          <!-- LEFT TEXT -->
          <div class="hero-text-section">
            <h1 class="hero-title animate-fade-up">

              <!-- LINE 1 -->
              <span class="block whitespace-nowrap max-md:whitespace-normal">
                Hi, I’m
                <span class="text-[color:var(--accent-color)]">Khin Andrei Gamboa</span>
              </span>

              <!-- LINE 2 (ONE LINE TYPEWRITER) -->
              <span class="block mt-2">
                <span class="typewriter-line">
                  <span class="typewriter-a">a</span>
                  <span id="typewriterText" class="typewriter-word"></span>
                </span>
              </span>

            </h1>

            <p class="hero-paragraph animate-fade-up" style="animation-delay:150ms">
              Computer Engineering student passionate about creating
              innovative hardware and software solutions through
              research and hands-on design.
            </p>

            <div class="cta-buttons animate-fade-up" style="animation-delay:300ms">
              <button class="btn btn-outline" onclick="openResumeTab()">
                View My Resume
              </button>
              <a href="contact.html" class="btn btn-outline">
                Get In Touch
              </a>
            </div>
          </div>

          <!-- RIGHT IMAGE -->
          <div class="hero-image-section">
            <div class="animate-fade-up" style="animation-delay:300ms">

              <!-- ✅ interactive tilt container -->
              <div
                class="hero-photo-wrapper group relative w-[450px] h-[600px] max-md:w-[300px] max-md:h-[420px] select-none"
                data-tilt
              >
                <!-- ✅ this layer moves as ONE (frame + profile) -->
                <div class="hero-tilt-layer absolute inset-0">

                  <!-- FRAME -->
                  <div
                    class="
                      hero-frame
                      absolute bottom-0 left-1/2 -translate-x-1/2
                      w-[400px] h-[450px]
                      max-md:w-[260px] max-md:h-[320px]
                      rounded-[10px] max-md:rounded-[8px]
                      overflow-hidden
                    "
                  >
                    <!-- Shine line (static, minimal) -->
                    <div class="absolute left-3 right-3 top-4 h-px bg-gradient-to-r from-transparent via-white/50 to-transparent opacity-50"></div>

                    <!-- corner glow (static, minimal) -->
                    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_left,rgba(255,255,255,0.15),transparent_58%)] opacity-60"></div>
                  </div>

                  <!-- IMAGE -->
                  <img
                    src="../assets/img/me.png"
                    alt="Profile picture"
                    class="
                      absolute bottom-0 left-1/2 -translate-x-1/2
                      h-[600px] max-md:h-[380px]
                      w-auto max-w-full object-contain
                      z-10 pointer-events-none
                    "
                  />
                </div>
              </div>

            </div>
          </div>

        </div>
      </div>
    </section>

    <!-- ROW TWO: ENGAGEMENT STATS -->
    <section class="engagement-section">
      <span class="section-label animate-fade-up">Live Network Activity</span>
      <div class="stats-grid">
        
        <div class="stat-card animate-fade-up" style="animation-delay: 100ms;">
          <i class="fas fa-globe stat-icon"></i>
          <h3 class="stat-value" id="visits-stat" data-target="0">0</h3>
          <p class="stat-label">Total Global Visits</p>
        </div>

        <div class="stat-card animate-fade-up" style="animation-delay: 200ms;">
          <i class="fas fa-code-branch stat-icon"></i>
          <h3 class="stat-value" data-target="412">0</h3>
          <p class="stat-label">GitHub Commits</p>
        </div>

        <div class="stat-card animate-fade-up" style="animation-delay: 300ms;">
          <i class="fas fa-microchip stat-icon"></i>
          <h3 class="stat-value" data-target="85">0</h3>
          <p class="stat-label">Scripts Deployed</p>
        </div>

        <div class="stat-card animate-fade-up" style="animation-delay: 400ms;">
          <i class="fas fa-bolt stat-icon"></i>
          <h3 class="stat-value" id="uptime-stat" data-target="99">0</h3>
          <p class="stat-label">System Uptime</p>
        </div>

      </div>
    </section>
  </main>

  <!-- RESUME TAB -->
  <section id="resumeTab" class="resume-tab" aria-hidden="true">
    <header class="resume-tab-header resume-tab-header--always-dark">
      <button class="resume-back" onclick="closeResumeTab()">← Back</button>
      <span class="resume-title">My Resume</span>
    </header>

    <div class="resume-viewer">
      <iframe src="../assets/Documents/My Resume.pdf" title="Resume"></iframe>
    </div>
  </section>

  <script src="../assets/js/index.js"></script>

  <script>
    function openResumeTab() {
      document.getElementById("resumeTab").classList.add("active");
      document.getElementById("homeContent").style.display = "none";
      document.body.style.overflow = "hidden";
    }

    function closeResumeTab() {
      document.getElementById("resumeTab").classList.remove("active");
      document.getElementById("homeContent").style.display = "";
      document.body.style.overflow = "";
    }

    // ✅ Typewriter Loop
    (function () {
      const el = document.getElementById("typewriterText");
      if (!el) return;

      const words = [
        "Aspiring Software Engineer.",
        "Aspiring Web Developer.",
        "Aspiring IT Specialist."
      ];

      let wordIndex = 0;
      let charIndex = 0;
      let deleting = false;

      const TYPE = 65;
      const DELETE = 40;
      const HOLD = 900;

      function tick() {
        const word = words[wordIndex];

        if (!deleting) {
          el.textContent = word.slice(0, ++charIndex);
          if (charIndex === word.length) {
            deleting = true;
            setTimeout(tick, HOLD);
            return;
          }
        } else {
          el.textContent = word.slice(0, --charIndex);
          if (charIndex === 0) {
            deleting = false;
            wordIndex = (wordIndex + 1) % words.length;
          }
        }
        setTimeout(tick, deleting ? DELETE : TYPE);
      }

      el.textContent = "";
      tick();
    })();

    // ✅ Live Engagement Stats & Animation
    (function () {
      const counters = document.querySelectorAll('.stat-value');
      const speed = 50; // Lower is faster

      const animateCounters = () => {
        counters.forEach(counter => {
          const updateCount = () => {
            const target = +counter.getAttribute('data-target');
            const count = +counter.innerText.replace(/[^0-9]/g, ''); // Extract just numbers
            
            // Prevent division by zero or errors
            if (target === 0) return;
            
            const inc = target / speed;

            if (count < target) {
              counter.innerText = Math.ceil(count + inc);
              setTimeout(updateCount, 15);
            } else {
              // Add suffix based on ID
              if (counter.id === 'uptime-stat') {
                counter.innerText = target + '%';
              } else if (counter.id === 'visits-stat') {
                counter.innerText = target; // No plus for exact live stats
              } else {
                counter.innerText = target + '+';
              }
            }
          };
          updateCount();
        });
      };

      // Fetch Real GitHub Pages Views
      const fetchViews = async () => {
        try {
          // This API increments the view counter on every request for this unique namespace/key
          const response = await fetch('https://api.counterapi.dev/v1/sondre01/portfolioviews/up');
          const data = await response.json();
          
          const visitsStat = document.getElementById('visits-stat');
          if (visitsStat) {
             // Update the target to the live count!
             visitsStat.setAttribute('data-target', data.count);
          }
        } catch (error) {
          console.error('Error fetching live views:', error);
        }
      };

      // Use IntersectionObserver to trigger animation when scrolled into view
      const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) {
          animateCounters();
          observer.disconnect();
        }
      }, { threshold: 0.3 });

      const statsSection = document.querySelector('.engagement-section');
      
      // We trigger the API request as soon as the script runs to log the visit, 
      // but wait to animate until they scroll.
      fetchViews().finally(() => {
        if (statsSection) {
          observer.observe(statsSection);
        }
      });
    })();
  </script>
</body>
</html>
